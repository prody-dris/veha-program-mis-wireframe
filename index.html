<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Program MIS Dashboard · Veha Foundation</title>
<style>
:root{
  /* One token system. Severity: good green, process blue and teal, attention orange (carriers, partner advised testing), serious deep orange (at-risk couple, Sickle cell disease), most serious red (Thalassemia major), failure reds (Declined, Lost to follow-up), decision plums, Not available grey. Navbar purple is the only purple. Opacity scale: 100, 40 (ribbons), 10 (tracks, empty), 6 (tints). */
  --brand:#2863AB; --brand-d:#2863AB; --brand-2:#2863AB; --brand-3:#98A6B8;
  --tab1:#2863AB; --tab1d:#2863AB; --tab2:#008893; --tab2d:#00828D; --tab3:#2863AB; --tab3d:#2863AB;
  --good:#118659; --goodd:#118659; --att:#C9690C; --attd:#B85900; --aff1:#B74B21; --l4:#AC3031; --neg:#C74B47; --neg2:#6E2826;
  --dec1:#6C5289; --dec2:#9D86BA; --nr:#A0A5AB; --nrd:#6B7280;
  --att-t:#FCF6F0; --ty1:#C9690C; --ty2:#E1A263; --ty3:#B74B21; --ty4:#EFD3AC; --tyd:#5A2E05;
  --soft:color-mix(in srgb,var(--brand) 6%,#FFFFFF); --soft2:color-mix(in srgb,var(--brand) 10%,#FFFFFF); --brand-line:#D1D5DB;
  --ink-d:#374151; --navy:#374151;
  --ink:#1F2328; --ink-2:#374151; --ink-3:#6B7280; --line:#E5E7EB; --side:#F9FAFB; --bg:#FFFFFF;
  --good-soft:#F1F8F5; --neg-soft:#FAF3F3; --warn:#4A5666; --warn-soft:#F1F5F9; --bad:#AC3031; --bad-soft:#FAF3F3; --gold:#6B7280; --gold-soft:#F1F5F9;
  --sans:InterVariable,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;color-scheme:light}
a{color:inherit;text-decoration:none}
.desk{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}

/* sidebar, replicated from UAT */
.sb{background:var(--side);border-right:1px solid #E5E7EB;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:10px 8px;overflow-y:auto}
.sb .hd{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;font-size:15px;font-weight:500;color:#1F2328}
.sb .hd img{width:32px;height:32px}
.sb .hd .chev{margin-left:auto;color:#6B7280}
.sb .it{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;color:#374151;font-size:13.5px;white-space:nowrap;cursor:pointer;line-height:1.25}
.sb .it:hover{background:#F1F5F9}
.sb .it.sel{background:#FFFFFF;box-shadow:0 0 0 1px #E5E7EB}
.sb .it .ic{width:18px;height:18px;flex:none;color:#374151}
.sb .it .dd{margin-left:auto;color:#6B7280;font-size:11px}
.sb .kids{padding-left:18px}
.sb .kids .kids{padding-left:22px}
.sb .it.on{color:var(--brand);font-weight:600}
.sb .foot{margin-top:auto;padding:10px 8px;color:#374151;font-size:14px;display:flex;gap:8px;align-items:center}

/* navbar */
.nb{background:#582AA2;height:47px;display:flex;align-items:center;padding:0 18px;gap:18px;color:#FFFFFF;position:sticky;top:0;z-index:5}
.nb img{height:33px}
.nb .sp{flex:1}
.nb .help{font-size:14px}
.nb .av{width:28px;height:28px;border-radius:50%;background:#F1F8F5;color:#118659;display:grid;place-items:center;font-weight:600;font-size:12px;border:1.5px solid #FFFFFF}
.ph{display:flex;align-items:center;gap:10px;padding:16px 26px 4px;font-size:19px;color:#1F2328}
.ph .crumb{font-size:13px;color:var(--ink-3);margin-left:6px}
.ph .crumb a{color:var(--brand);cursor:pointer}
.wrap{padding:8px 26px 48px;max-width:1240px}

section[data-view]{display:none}
section[data-view].active{display:block}

/* page head + filters */
.thead{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.thead h1{font-size:19px;margin:0;font-weight:600}
.period{margin-left:auto;background:#F1F5F9;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;color:var(--ink-2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sel{border:1px solid #D1D5DB;border-radius:7px;padding:6px 30px 6px 11px;font-size:13.5px;background:#FFFFFF;position:relative;min-width:140px;color:var(--ink)}
.sel:after{content:"";position:absolute;right:11px;top:13px;border:4px solid transparent;border-top-color:#6B7280}
.btn{border:1px solid #D1D5DB;background:#FFFFFF;border-radius:7px;padding:6px 14px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.btn.pr{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.scope{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--soft);color:var(--ink-d);border-radius:10px;padding:10px 14px;margin:4px 0 22px;font-size:13.5px}
.scope .chip{background:#FFFFFF;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.scope b{font-weight:600}

/* highlights */
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.hlc{border-radius:12px;padding:16px 18px;color:#FFFFFF;position:relative;overflow:hidden;cursor:pointer}
.hlc .big{font-size:34px;font-weight:700;line-height:1.05}
.hlc .t{font-size:14.5px;margin-top:6px;opacity:1}
.hlc .s{font-size:12.5px;margin-top:8px;opacity:1}
.hlc .ring{position:absolute;right:14px;top:14px}
.hlc.c1{background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.hlc.c2{background:linear-gradient(135deg,#00828D,#00828D)}
.hlc.c3{background:linear-gradient(135deg,#4A5666,var(--brand))}

/* step frame */
.step{border:1px solid var(--line);border-radius:14px;padding:18px 20px 20px;margin-bottom:18px;position:relative;background:#FFFFFF}
.step:before{content:"";position:absolute;left:-1px;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh .no{width:26px;height:26px;border-radius:50%;background:var(--sc);color:#FFFFFF;font-weight:700;display:grid;place-items:center;font-size:13px}
.sh h2{font-size:16.5px;margin:0;font-weight:600}
.sh .q{font-size:13px;color:var(--ink-3)}
.sh .tag{margin-left:auto;font-size:12px;color:var(--ink-3)}
.connector{display:flex;justify-content:center;margin:-10px 0 8px;color:var(--ink-3);font-size:12px;gap:8px;align-items:center}
.connector i{display:block;width:2px;height:14px;background:var(--brand-line)}

/* staircase */
.stairs{display:grid;grid-template-columns:1fr 92px 1fr 92px 1fr;align-items:end}
.stc{cursor:pointer}
.stc .lab{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.stc .v{font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.stc .blk{border-radius:10px 10px 4px 4px;position:relative;display:flex;align-items:flex-end;padding:10px 12px;color:#FFFFFF;font-size:12.5px}
.stc:hover .blk{filter:brightness(1.08)}
.stc .trend{font-size:12px;margin-bottom:6px}
.conv{align-self:center;text-align:center;padding-bottom:30px}
.conv .p{display:inline-block;background:var(--soft);color:var(--brand);font-weight:700;border-radius:999px;padding:4px 10px;font-size:13px}
.conv .w{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.conv .ar{font-size:20px;color:var(--brand-3);line-height:1}

.up{color:var(--good)} .dn{color:var(--bad)}
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid #D1D5DB;color:#A0A5AB;font-size:10px;font-weight:700;cursor:help;position:relative;font-style:normal}
.tip:hover:after{content:attr(data-tip);position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#FFFFFF;font-weight:400;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:7px;width:240px;z-index:20;text-align:left}

/* type split */
.types{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tc{border-radius:10px;padding:12px 14px;cursor:pointer;border:1px solid transparent}
.tc:hover{border-color:currentColor}
.tc .k{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.tc .v{font-size:28px;font-weight:700;color:var(--ink);line-height:1.15}
.tc .s{font-size:12px;color:var(--ink-2)}
.tc .cue{font-size:12px;color:var(--ink-2);margin-top:8px;border-top:1px dashed rgba(0,0,0,.1);padding-top:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* couples */
.cpl{display:grid;grid-template-columns:1.25fr 70px 1fr;gap:0;align-items:stretch}
.box{border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;background:#FFFFFF}
.box:hover{background:#F9FAFB}
.box .k{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.box .v{font-size:30px;font-weight:700;line-height:1.15}
.box .s{font-size:12.5px;color:var(--ink-3)}
.prog{height:10px;border-radius:6px;background:#F1F5F9;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;border-radius:6px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3);font-size:12px;text-align:center}
.mid b{color:var(--gold);font-size:14px}
.flag{display:flex;gap:8px;align-items:flex-start;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
.flag.w{background:var(--warn-soft);color:#4A5666}
.flag.b{background:var(--bad-soft);color:#6E2826}
.flag.g{background:var(--good-soft);color:#118659}
.flag .fi{font-weight:700}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini span{background:var(--gold-soft);color:#4A5666;border-radius:6px;padding:2px 8px;font-size:12px}

/* pnd chain */
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
.node{border-radius:10px;padding:12px 14px;cursor:pointer;position:relative;border:1px solid var(--line);background:#FFFFFF}
.node:hover{box-shadow:0 2px 10px rgba(31,42,55,.1)}
.node .k{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;min-height:19px}
.node .v{font-size:28px;font-weight:700;line-height:1.15}
.node .s{font-size:12px;color:var(--ink-3)}
.node:not(:last-child):after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--brand-line);font-size:20px;font-weight:700;z-index:2}
.node.na .v{font-size:16px;color:var(--ink-3);padding:8px 0}
.sp2{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.sp2 span{border-radius:5px;padding:1px 7px}
.bar3{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#F1F5F9;margin-top:8px}
.bar3 i{display:block;height:100%}

/* chart + partners */
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:#FFFFFF}
.card h3{font-size:15.5px;margin:0;font-weight:600}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid #D1D5DB;border-radius:7px;overflow:hidden;margin-left:auto}
.seg span{padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg span.on{background:var(--brand);color:#FFFFFF}
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap;margin-top:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.prow{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:hover{background:#F9FAFB}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;font-size:14px}
.prow .pg{font-size:12px;color:var(--ink-3)}
.prow .rv{text-align:right;font-size:12.5px;color:var(--ink-2)}
.prow .rv b{font-size:15px;color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600}
.pill.g{background:var(--good-soft);color:var(--good)} .pill.w{background:var(--warn-soft);color:var(--warn)} .pill.b{background:var(--bad-soft);color:var(--bad)} .pill.n{background:#F1F5F9;color:var(--ink-3)}

/* tables */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;color:var(--ink-3);font-weight:600;background:#F9FAFB}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
tr.tot td{font-weight:700;border-top:2px solid #D1D5DB;background:#F9FAFB}
tr.muted td{color:var(--ink-3)}
.tw{overflow-x:auto}
.hbar{display:inline-block;height:9px;border-radius:3px;vertical-align:middle;margin-right:8px}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px}
.mtabs span{border:1px solid #D1D5DB;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);background:#FFFFFF}
.mtabs span.on{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.share{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:4px 0 6px}
.share i{display:flex;align-items:center;padding-left:10px;color:#FFFFFF;font-size:12.5px;font-style:normal;font-weight:600;white-space:nowrap;overflow:hidden}
.heat{display:inline-block;min-width:54px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:600}
.pbtn{display:flex;gap:8px;margin:0 0 12px}
.fchips{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.fchips span{background:var(--soft);color:var(--brand);border-radius:6px;padding:4px 10px;font-size:13px}
.note{font-size:12px;color:var(--ink-3);margin-top:16px}

/* v3.1: parts, tiles, in-place drill */
.part{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.part .pl{font-size:12px;font-weight:700;letter-spacing:.08em;color:#FFFFFF;background:var(--pc);border-radius:6px;padding:3px 9px}
.part h2{font-size:17px;margin:0;font-weight:600}
.part .q{font-size:13px;color:var(--ink-3)}
.part:after{content:"";flex:1;height:1px;background:var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--brand);cursor:pointer;font-weight:600}
.crumbs .cur{background:#FFFFFF;border:1px solid var(--brand-line);border-radius:999px;padding:2px 6px 2px 12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.crumbs .x{width:18px;height:18px;border-radius:50%;background:var(--soft2);color:var(--brand);display:grid;place-items:center;font-size:11px;cursor:pointer}
.tiles{display:flex;align-items:stretch;gap:0}
.tile{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FFFFFF;cursor:pointer;position:relative;transition:box-shadow .15s}
.tile:hover{box-shadow:0 3px 12px rgba(31,42,55,.1)}
.tile .bar{position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--tc)}
.tile .k{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;min-height:19px}
.tile .v{font-size:27px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--ink-3)}
.tile .more{font-size:11.5px;color:var(--brand);margin-top:6px;opacity:0;transition:opacity .15s}
.tile:hover .more{opacity:1}
.tile.open{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 10%,transparent)}
.tile.open .more{opacity:1}
.tile.open:after{content:"";position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--tc)}
.tile.na .v{font-size:16px;color:var(--ink-3);padding:6px 0}
.link{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3);text-align:center;line-height:1.25}
.link b{font-size:12.5px;color:var(--lc,var(--brand))}
.link .a{font-size:16px;color:var(--brand-line);line-height:1}
.drill{border:1px solid var(--line);border-top:3px solid var(--dc);border-radius:12px;background:#F9FAFB;padding:14px 16px;margin:12px 0 4px;animation:dr .18s ease-out}
@keyframes dr{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.drill .dh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.drill .dh b{font-size:14.5px}
.drill .dh .cl{margin-left:auto;cursor:pointer;color:var(--ink-3);font-size:13px}
.drow{display:grid;grid-template-columns:200px 1fr 70px 60px 150px;gap:12px;align-items:center;padding:7px 4px;border-bottom:1px solid #F1F5F9;font-size:13.5px}
.drow:last-child{border-bottom:0}
.drow .track{height:12px;background:#F1F5F9;border-radius:6px;overflow:hidden}
.drow .track i{display:block;height:100%;border-radius:6px}
.drow .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.drow .sh{display:block;margin:0;text-align:right;color:var(--ink-3);font-size:12.5px}
.drow .act{text-align:right}
.drow .act a{color:var(--brand);cursor:pointer;font-weight:600;font-size:12.5px}
.drow.muted{color:var(--ink-3)}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px}
.stack i{display:block;height:100%}
.flags{display:grid;gap:8px;margin-top:12px}
.flags .flag{margin-top:0}
/* v3.2: persona pass */
.hlc{background:#FFFFFF!important;color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--hc)}
.hlc .big{color:var(--hc);font-size:36px}
.hlc .t{font-size:14px;color:var(--ink-2);opacity:1}
.tiles.stair .tile .v{font-size:32px}
.fill{height:8px;border-radius:4px;background:#F1F5F9;margin-top:10px;overflow:hidden}
.fill i{display:block;height:100%;background:var(--tc)}
.chain{display:flex;align-items:stretch;gap:0}
.chain .tile{min-width:0}
.ar{flex:none;width:22px;display:grid;place-items:center;color:var(--brand-line);font-size:18px}
.rows{margin-top:8px;border-top:1px solid #F1F5F9;padding-top:6px;display:grid;gap:3px}
.rows div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.rows b{font-variant-numeric:tabular-nums;color:var(--ink)}
.rows .na{display:block}
.rows .na b{display:block;color:var(--ink-3);font-weight:500;font-size:12px}
.tiles.stair{align-items:flex-start}
.tiles.stair .tile{min-height:118px}
.share i{min-width:34px}
.drow{grid-template-columns:260px 1fr 80px 60px 150px}
/* v3.3: tabs, staircase panels, drawer */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 18px}
.tabs a{padding:10px 16px;font-size:14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs a.on{color:var(--tad,var(--brand-d));border-bottom-color:var(--ta,var(--brand));font-weight:600}
.panel{border:1px solid var(--line);border-radius:14px;background:#FFFFFF;padding:18px 20px;margin-bottom:18px}
.panel h3{font-size:14.5px;margin:0 0 14px;font-weight:600}
.stair2{display:grid;gap:8px;align-items:end}
.sc{cursor:pointer}
.sc .lk{font-size:13px;color:var(--ink-2);margin:0 0 6px 2px;line-height:1.3}
.sc .blk{border-radius:10px 10px 4px 4px;color:#FFFFFF;padding:12px 14px;display:flex;align-items:flex-end;justify-content:space-between;transition:filter .15s,box-shadow .15s}
.sc:hover .blk{filter:brightness(1.08)}
.sc.open .blk{box-shadow:0 0 0 3px rgba(31,42,55,.1)}
.sc .blk .v{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sc .blk .v.na{font-size:14px;font-weight:600;opacity:1}
.sc .blk .go{font-size:12px;opacity:1}

table.pt th:first-child,table.pt td:first-child{padding-left:22px}table.pt th:last-child,table.pt td:last-child{padding-right:22px}
table.pt tr.pr{cursor:pointer;animation:fu .35s ease-out both}
table.pt tr.pr:hover td{background:#F9FAFB}
table.pt tr.pr:hover .pn{text-decoration:underline;text-underline-offset:2px}
table.pt tr.pr.z{cursor:default;color:var(--ink-3)}
table.pt tr.pr.z:hover td{background:transparent}
table.pt tr.pr.z:hover .pn{text-decoration:none}
table.pt .pn{font-weight:600}
table.pt .pg3{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-left:17px}
table.pt .sb2{display:flex;align-items:center;gap:10px;justify-content:flex-end}
table.pt .sb2 u{display:block;width:120px;height:7px;background:#F1F5F9;border-radius:4px;overflow:hidden;text-decoration:none}
table.pt .sb2 u i{display:block;height:100%;border-radius:4px}
table.pt tr.tot td{font-weight:700;border-top:2px solid #D1D5DB;border-bottom:0;background:#F9FAFB}
table.pt .go2{color:var(--brand);font-size:16px}
table.dt th.n{white-space:normal;max-width:96px;line-height:1.25}
table.dt.fu th{white-space:normal;line-height:1.25;vertical-align:bottom}
table.dt.fu td{white-space:normal}
table.dt.fu td:nth-child(-n+4),table.dt.fu td:first-child{white-space:nowrap}
@media print{.cgrid{grid-template-columns:1fr 1fr}.cwrap{break-inside:avoid}}

/* v8: chart variety */
.clg{font-size:12.5px;color:var(--ink-3);margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clg .sw{display:inline-block;width:16px;height:12px;border-radius:3px;margin-right:-2px}
.clg .sw.hat{background:repeating-linear-gradient(45deg,#F1F5F9 0 3px,#D1D5DB 3px 5px);border:1px solid #D1D5DB;margin-left:10px}
svg.ch2 text{font-family:var(--sans)}
svg.ch2 .rw,svg.ch2 .sg{cursor:pointer}
svg.ch2 .rw:hover{opacity:1}
svg.ch2 .rw:hover .lb{text-decoration:underline}
svg.ch2 .halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
svg.ch2 .brr{transform-box:fill-box;transform-origin:bottom;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.donut svg{flex:none}
@media (max-width:1279px){.cgrid{grid-template-columns:1fr}}

/* v9: round 4 polish */
.tabs{z-index:8;position:sticky}
.tabs:after{content:"";position:absolute;left:0;right:0;top:100%;height:22px;background:linear-gradient(#FFFFFF,rgba(255,255,255,0));pointer-events:none}
.panel,.cpan,.sec{scroll-margin-top:120px}
.cpan .sec{font-size:15px;margin-bottom:18px}
.donut{gap:18px;align-items:center}
.donut svg{width:132px;height:132px}
.donut svg.wf{width:176px;height:176px}
.dl2{gap:2px}
.dl2 .lr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl2 .lr{grid-template-columns:12px minmax(0,1fr) 44px 44px;font-size:13.5px;line-height:1.3;gap:10px;padding:7px 6px}
.dl2 .lr em{font-size:13px}
.wtxt{flex:1 1 0;min-width:0}
.wtxt .big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wtxt .wl{font-size:14.5px;color:var(--ink);line-height:1.4;margin-top:10px}
.wtxt .wm{font-size:13px;color:var(--ink-3);margin-top:8px}
svg.ch2 .hit{fill:transparent}
svg.ch2 .rw:hover .hit{fill:#F1F5F9}
svg.ch2 .rw:hover{opacity:1}
svg.ch2 path:hover,svg.ch2 .sg:hover{opacity:1}
.clg{flex-wrap:nowrap;white-space:nowrap;gap:8px;font-size:12.5px;margin-top:16px}
.clg .sw{margin-right:0}
.clg .sw.hat{margin-left:14px}
.clg.kk{flex-wrap:wrap!important;white-space:normal!important;row-gap:6px}.clg .lg{display:inline-flex;align-items:center;gap:4px;margin-right:12px}.clg .lg.lgd{margin-left:14px;font-weight:600;color:var(--ink-2)}.clg .lg i.lgs{width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,#118659,#2863AB,#C9690C,#B74B21)}.clg .lg i{display:inline-block;width:12px;height:12px;border-radius:3px}
#ctip{position:fixed;z-index:70;pointer-events:none;display:none;background:#4A5666;color:#FFFFFF;font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:7px;white-space:nowrap;box-shadow:0 6px 16px rgba(20,26,34,.1)}
/* breakdown rows: shared grid, no stray borders, one baseline */
.rsplit{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:start}
.rg{padding:0 26px 0 0;border-left:0}
.rg+.rg{padding:0 0 0 26px;border-left:1px solid var(--line)}
.rg:first-child{padding-left:0}
.types{align-items:start}
.types.rc{grid-template-columns:1fr 1fr;column-gap:20px}
.types.rc .ty,.types.rc .ty:first-child{padding:6px 0 4px;border-left:0;border-radius:0}
.types.rc .ty:hover{background:transparent}
.types.rc .ty:hover .lk{text-decoration:underline;text-underline-offset:2px}
.types.rc .ty .lk,.types.t4 .ty .lk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-height:1.4em;line-height:1.4}
.types.rc .ty .lk{font-size:13.5px}
.types.rc .ty .p{min-height:1.4em;line-height:1.4}
.types.t4{column-gap:0}
.types.t4 .ty{padding:6px 22px 4px;border-left:1px solid var(--line);border-radius:0}
.types.t4 .ty:first-child{padding-left:0;border-left:0}
.types.t4 .ty:last-child{padding-right:0}
.types.t4 .ty:hover{background:transparent}
.types.t4 .ty:hover .lk{text-decoration:underline;text-underline-offset:2px}
.types.t4 .ty .lk{display:flex;white-space:normal;overflow:visible;min-height:2.8em;align-items:flex-start}
.types.t4 .ty .p{min-height:2.8em;line-height:1.4}
@media (max-width:1279px){.types.t4{grid-template-columns:repeat(2,1fr);row-gap:18px}.types.t4 .ty:nth-child(3){padding-left:0;border-left:0}}

.stk{display:flex;flex-direction:column;gap:28px;min-width:0}
.stk .panel{margin-bottom:0;flex:1 1 auto}
.rk{display:grid;gap:2px}
.rkr{display:grid;grid-template-columns:minmax(70px,.9fr) minmax(60px,1.4fr) 46px minmax(84px,auto);gap:12px;align-items:center;min-height:32px;padding:0 8px;margin:0 -8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.rkr:hover{background:#F1F5F9}
.rkr .tr{height:6px;border-radius:4px;background:#F1F5F9;overflow:hidden;display:block}
.rkr .tr i{display:block;height:100%;border-radius:4px;background:var(--tab2)}
.rkr b{text-align:right;font-variant-numeric:tabular-nums;color:var(--tab2d)}
.rkr em{font-style:normal;color:var(--ink-3);font-size:12.5px;text-align:right;white-space:nowrap}
.rkr.tot{border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px;font-weight:700}
.rkr.tot .tr i{background:var(--tab2d)}

.cgrid.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cpan{container-type:inline-size}
@container (max-width:440px){.donut{flex-direction:column;align-items:flex-start;gap:14px}.donut .dl2{width:100%}.donut svg.wf{width:150px;height:150px}}
@media (max-width:1279px){.cgrid.even{grid-template-columns:1fr}}
.rkr .tr i{background:var(--good)}.rkr b{color:var(--goodd)}.rkr.tot .tr i{background:var(--goodd)}
.clg:has(.sklg){justify-content:flex-start;gap:0}.sklg{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 20px;font-size:12px;color:var(--ink-2)}.sklg .lg{display:inline-flex;flex-direction:row;align-items:center;gap:6px;margin:0;font-size:12px;white-space:nowrap}.sklg .lg i{display:inline-block;flex:none;width:10px;height:10px;border-radius:2px;margin:0}.sklg .lg i.lgs{width:96px;height:8px;border-radius:999px}.sklg .lg.lgd{margin:0;font-weight:600}
</style>

/* care cascade: bars fall left to right, each step shows its share of the step before. Only used for true care steps. */

    var h=x.v?Math.max(4,chh*x.v/mx):2,cxm=pad+i*colW+colW/2,bx=cxm-bw/2,by=y0-h,inner='';

    var words=x.l.split(' '),lines=[''],mc=Math.max(10,Math.floor(colW/7.6));
    words.forEach(function(w){var L=lines[lines.length-1];if((L+' '+w).trim().length>mc&&L)lines.push(w);else lines[lines.length-1]=(L+' '+w).trim()});
    inner+=lines.slice(0,3).map(function(L,j){return '<text x="'+cxm+'" y="'+(y0+20+j*16)+'" text-anchor="middle" font-size="13.5" fill="#1F2328">'+L+'</text>'}).join('');

    s+=mark(x.k,null,x.v,x.l,inner);

}

/* ranked table: one row per partner (or city) with a thin inline bar for the share, number and the counts behind it */
function ranked(rows,ref,k,dk){
  rows=rows.filter(function(r){return r.den>0}).map(function(r){r.rate=100*r.num/r.den;return r}).sort(function(a,b){return b.rate-a.rate});
  if(!rows.length)return '<div class="empty" style="padding:30px 0">No data in this selection</div>';
  var line=function(l,r,f,bold){return '<div class="rkr'+(bold?' tot':'')+'" data-k="'+k+'" data-v="'+r.num+'" data-den="'+r.den+'" data-dk="'+dk+'"'+(f?" data-f='"+JSON.stringify(f)+"'":'')+' data-t="'+l+': '+n(r.num)+' of '+n(r.den)+'" onclick="'+(f?'openX(\''+k+'\','+fjs(f)+')':'openD(\''+k+'\')')+'"><span class="o">'+l+'</span><span class="tr"><i style="width:'+Math.min(100,r.rate)+'%"></i></span><b>'+pc(r.num,r.den)+'</b><em>'+n(r.num)+' of '+n(r.den)+'</em></div>'};
  return '<div class="rk">'+rows.map(function(r){return line(r.l,r,r.f,false)}).join('')+line('Overall',ref,null,true)+'</div>';
}

      {k:'mtp',rt:'Type of hemoglobinopathy',rows:[['Thalassemia major',d.mtpT,'mtpT','var(--l4)'],['Sickle cell disease',d.mtpS,'mtpS','var(--aff1)'],mnr>0?['Not available',mnr,null,'var(--nr)']:null]}];
    var hs=st.map(function(_,i){return 200-i*Math.round(80/(st.length-1))});
    h+='<div class="panel"><div class="sec" style="--sa:var(--tab3)">Prenatal testing results</div>'+stair(st,d,hs)+'</div>';
  }
  h+=chartsFor(state.tab,d);
  return h+'</div>';
}
function animate(root){
  var reduce=state.print||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  if(state.print)[].forEach.call(root.querySelectorAll('.reveal'),function(e){e.classList.add('in')});
  [].forEach.call(root.querySelectorAll('.cu'),function(e){
    var v=+e.dataset.v,dec=+e.dataset.d,suf=e.dataset.s,fmt=function(x){return (dec?x.toFixed(dec):Math.round(x).toLocaleString('en-IN'))+suf};
    if(reduce||!v){e.textContent=fmt(v);return}
    var t0=null,dur=900;function step(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/dur),ease=1-Math.pow(1-k,3);e.textContent=fmt(v*ease);if(k<1)requestAnimationFrame(step)}
    requestAnimationFrame(step);
  });
  var els=root.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){[].forEach.call(els,function(e){e.classList.add('in')});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.12});
  [].forEach.call(els,function(e){io.observe(e)});
}
function renderDash(){
  renderFilters();
  document.getElementById('d-title').textContent='Program MIS dashboard'+(F.partner?' · '+P[F.partner].name:F.prog?' · '+F.prog:'')+(F.city||F.st?' · '+(F.city||F.st):'');
  var dash=document.getElementById('dash');dash.innerHTML=dashboard();animate(dash);
  drawer();
}
function setTab(t){state.tab=t;state.open=null;state.dp=null;state.dx=null;renderDash()}

/* reports */
function openReport(kind,m,p,c){state.report=kind;state.month=m==null?null:(m.length!=null?m:[m]);state.rf=p?{p:p,c:c}:null;state.open=null;state.dp=null;state.dx=null;document.getElementById('drawer').innerHTML='';go('report-'+kind)}
function renderReport(){
  var kind=state.report,rs=pick().filter(function(r){return (state.month==null||state.month.indexOf(r.a)>=0)&&(!state.rf||(r.p===state.rf.p&&r.c===state.rf.c))});
  rs.sort(function(a,b){return a.a-b.a||a.p.localeCompare(b.p)||a.c.localeCompare(b.c)});
  var S=kind==='screening'?[['reg','Women registered'],['nivf','Registered ANC'],['ivf','Registered IVF'],['le12','Registered before 12 weeks'],['gt12','Registered after 12 weeks'],['scr','Women screened'],['thal','Beta thalassemia carrier'],['sick','Sickle cell carrier'],['scdd','Sickle cell disease'],['oth','Other hemoglobinopathies'],['pos','Women identified as carriers']]
    :[['padv','Partner advised testing'],['pscr','Partner screened'],['risk','At-risk couple'],['dec','Declined prenatal diagnosis'],['ltfu','Lost to follow-up'],['pnd','Prenatal diagnosis'],['cvs','Chorionic villus sampling (CVS)'],['amn','Amniocentesis'],['affT','Thalassemia major'],['affS','Sickle cell disease'],['couns','Couple counselled'],['mtpT','Medical termination of pregnancy, thalassemia major'],['mtpS','Medical termination of pregnancy, sickle cell disease']];
  document.getElementById('r-title').textContent=kind==='screening'?'Screening Report':'Follow-up Report';
  document.getElementById('r-chips').innerHTML=[state.month!=null?(state.month.length>1?'Period = '+aLabel(state.month[0])+' to '+aLabel(state.month[state.month.length-1]):'Month = '+aLabel(state.month[0],true)):'Period = '+periodText(),F.prog&&!state.rf?'Programme = '+F.prog:'',(state.rf||F.partner)?'Partner = '+P[state.rf?state.rf.p:F.partner].full:'',(state.rf||F.city)?'City = '+(state.rf?state.rf.c:F.city):F.st?'State = '+F.st:''].filter(function(x){return x}).map(function(c){return '<span>'+c+'</span>'}).join('')+'<span style="background:#F1F5F9;color:#374151">+ Filter</span>';
  var tot=agg(rs),cell=function(o,k){return k==='pos'?o.thal+o.sick+o.oth+o.scdd:o[k]};
  document.getElementById('r-table').innerHTML='<table><thead><tr><th>Month</th><th>Partner</th><th>Programme</th><th>City</th>'+S.map(function(s){return '<th class="n">'+s[1]+'</th>'}).join('')+'</tr></thead><tbody>'+
    rs.map(function(r){return '<tr><td style="white-space:nowrap">'+aLabel(r.a)+'</td><td>'+P[r.p].name+'</td><td>'+P[r.p].prog+'</td><td>'+r.c+'</td>'+S.map(function(s){return '<td class="n">'+n(cell(r,s[0]))+'</td>'}).join('')+'</tr>'}).join('')+
    '<tr class="tot"><td colspan="4">Total · '+rs.length+' rows</td>'+S.map(function(s){return '<td class="n">'+n(cell(tot,s[0]))+'</td>'}).join('')+'</tr></tbody></table>';
  state.rdl={name:document.getElementById('r-title').textContent+' '+periodText(),head:['Month','Partner','Programme','City'].concat(S.map(function(s){return s[1]})),rows:rs.map(function(r){return [aLabel(r.a),P[r.p].name,P[r.p].prog,r.c].concat(S.map(function(s){return cell(r,s[0])}))})};
}

function go(v){location.hash='#'+v}
function show(){
  var id=(location.hash||'#dashboard').slice(1),view=id.indexOf('report-')===0?'records':'dashboard';
  if(view==='records'){var k=id.slice(7);if(k!==state.report){state.report=k;state.month=null;state.rf=null}}
  [].forEach.call(document.querySelectorAll('section[data-view]'),function(v){v.classList.toggle('active',v.dataset.view===view)});
  if(view==='dashboard')renderDash();else renderReport();
  window.scrollTo(0,0);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.open)closeD()});
sidebar();window.addEventListener('hashchange',show);show();

</script>
